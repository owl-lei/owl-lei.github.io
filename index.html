<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阳春市福颐康乐养老中心床位智慧大屏</title>
    <style>
      :root {
        --bg-0: #050b1a;
        --bg-1: #0a1428;
        --bg-2: #0f1f3d;
        --panel: rgba(16, 34, 64, 0.72);
        --panel-solid: #0c1b36;
        --border: rgba(64, 158, 255, 0.35);
        --border-soft: rgba(64, 158, 255, 0.18);
        --cyan: #00e5ff;
        --cyan-dim: #2bb8ff;
        --blue: #3a9bff;
        --text: #d6e6ff;
        --text-dim: #7d93b8;
        --text-muted: #5a7099;

        --st-occupied: #00e676;
        --st-free: #607d8b;
        --st-hospital: #ff6d00;
        --st-leave: #448aff;
        --st-empty: #2a3a55;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg-0);
        color: var(--text);
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(ellipse at 20% 0%, rgba(0, 120, 255, 0.12), transparent 50%),
          radial-gradient(ellipse at 80% 100%, rgba(0, 229, 255, 0.1), transparent 50%),
          linear-gradient(180deg, #050b1a 0%, #070f22 100%);
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(64, 158, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(64, 158, 255, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }

      .app {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding: 14px 20px 18px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border-soft);
      }
      .title-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .logo {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--cyan), var(--blue));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: bold;
        color: #03122e;
        box-shadow: 0 0 18px rgba(0, 229, 255, 0.5);
      }
      .title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 4px;
        background: linear-gradient(90deg, #fff, var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subtitle {
        font-size: 12px;
        color: var(--text-dim);
        letter-spacing: 2px;
        margin-top: 2px;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .clock {
        font-size: 14px;
        color: var(--cyan);
        font-family: 'Courier New', monospace;
        text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
      }
      .file-btn {
        background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(58, 155, 255, 0.15));
        border: 1px solid var(--border);
        color: var(--cyan);
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        letter-spacing: 1px;
        transition: all 0.2s;
      }
      .file-btn:hover {
        background: rgba(0, 229, 255, 0.25);
        box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
      }
      .file-btn input {
        display: none;
      }

      /* ===== Stats bar (全表汇总) ===== */
      .stats {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 12px;
        padding: 14px 0;
      }
      .stat-card {
        background: var(--panel);
        border: 1px solid var(--border-soft);
        border-radius: 8px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        overflow: hidden;
      }
      .stat-card::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--cyan);
      }
      .stat-icon {
        width: 38px;
        height: 38px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
      }
      .stat-info .stat-val {
        font-size: 22px;
        font-weight: 700;
        font-family: 'Courier New', monospace;
      }
      .stat-info .stat-label {
        font-size: 12px;
        color: var(--text-dim);
        margin-top: 1px;
        letter-spacing: 1px;
      }

      .main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 280px;
        gap: 14px;
        min-height: 0;
      }

      .floor-section {
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border-soft);
        border-radius: 10px;
        overflow: hidden;
      }
      .floor-tabs {
        display: flex;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border-soft);
        background: rgba(5, 11, 26, 0.5);
        flex-wrap: wrap;
      }
      .floor-tab {
        padding: 7px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        letter-spacing: 1px;
        border: 1px solid var(--border-soft);
        background: rgba(15, 31, 61, 0.6);
        color: var(--text-dim);
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .floor-tab:hover {
        color: var(--cyan);
        border-color: var(--border);
      }
      .floor-tab.active {
        background: linear-gradient(135deg, rgba(0, 229, 255, 0.25), rgba(58, 155, 255, 0.15));
        color: #fff;
        border-color: var(--cyan);
        box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
      }
      .floor-tab .tab-name {
        font-weight: 600;
      }
      .floor-tab .tab-desc {
        font-size: 11px;
        color: var(--text-muted);
        opacity: 0.8;
      }

      .floor-canvas-wrap {
        flex: 1;
        overflow: auto;
        padding: 18px;
        background:
          linear-gradient(rgba(64, 158, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(64, 158, 255, 0.04) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      /* v3: 自适应网格，寝室自动排列，固定最小宽度保证文字完整显示 */
      .floor-canvas {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 10px;
        align-content: start;
      }

      .room {
        background: rgba(12, 27, 54, 0.85);
        border: 1px solid var(--border-soft);
        border-radius: 8px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        min-height: 70px;
        transition: all 0.15s;
        position: relative;
      }
      .room:hover {
        border-color: var(--cyan);
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(0, 229, 255, 0.2);
        z-index: 2;
      }
      .room-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border-soft);
      }
      .rname {
        font-size: 13px;
        font-weight: 600;
        color: var(--cyan);
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .rcount {
        font-size: 11px;
        color: var(--text-muted);
        font-family: 'Courier New', monospace;
        flex-shrink: 0;
      }
      .rnurse {
        flex-shrink: 1;
        min-width: 0;
        font-size: 11px;
        color: #ffe082;
        background: rgba(255, 193, 7, 0.1);
        border: 1px solid rgba(255, 193, 7, 0.3);
        padding: 1px 8px;
        border-radius: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rnurse.none {
        color: var(--text-muted);
        background: rgba(96, 125, 139, 0.1);
        border-color: rgba(96, 125, 139, 0.3);
      }
      .rnurse.none::before {
        display: none;
      }

      /* 护理人员筛选条（楼层平面图上方） */
      .nurse-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border-soft);
        background: rgba(5, 11, 26, 0.5);
        flex-shrink: 0;
      }
      .nurse-bar-label {
        font-size: 12px;
        color: var(--text-dim);
        letter-spacing: 1px;
        margin-right: 2px;
      }
      .nurse-chip {
        padding: 4px 14px;
        border-radius: 14px;
        cursor: pointer;
        font-size: 12px;
        letter-spacing: 0;
        border: 1px solid var(--border-soft);
        background: rgba(15, 31, 61, 0.6);
        color: var(--text-dim);
        transition: all 0.15s;
        white-space: nowrap;
      }
      .nurse-chip:hover {
        color: #ffe082;
        border-color: rgba(255, 193, 7, 0.5);
      }
      .nurse-chip.active {
        background: linear-gradient(135deg, rgba(255, 193, 7, 0.22), rgba(255, 152, 0, 0.14));
        color: #ffe082;
        border-color: #ffc107;
        box-shadow: 0 0 10px rgba(255, 193, 7, 0.25);
      }

      /* 右侧：护理人员看护统计 */
      .nurse-stat-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }
      .nurse-stat-item .ns-name {
        flex: 1;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nurse-stat-item .ns-name.ns-name-muted {
        color: var(--text-dim);
      }
      .nurse-stat-item .ns-val {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        color: #ffd54f;
      }
      .nurse-stat-item .ns-unit {
        font-size: 10px;
        color: var(--text-muted);
        margin-left: 2px;
        font-weight: 400;
      }
      .beds {
        display: grid;
        grid-template-columns: 1fr;
        gap: 4px;
        flex: 1;
      }
      .bed {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text);
        background: rgba(5, 11, 26, 0.5);
        border-radius: 4px;
        padding: 4px 8px;
        line-height: 1.5;
        white-space: nowrap;
      }
      .bed .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        box-shadow: 0 0 6px currentColor;
      }
      .bed .bno {
        color: var(--text-muted);
        font-family: monospace;
        font-size: 11px;
        flex-shrink: 0;
      }
      .bed .bname {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
      }
      .bed .bst {
        font-size: 10px;
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .dot.occupied {
        background: var(--st-occupied);
        color: var(--st-occupied);
      }
      .dot.free {
        background: var(--st-free);
        color: var(--st-free);
      }
      .dot.hospital {
        background: var(--st-hospital);
        color: var(--st-hospital);
      }
      .dot.leave {
        background: var(--st-leave);
        color: var(--st-leave);
      }

      .side {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 0;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border-soft);
        border-radius: 10px;
        padding: 14px;
      }
      .panel-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--cyan);
        margin-bottom: 12px;
        letter-spacing: 2px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .panel-title::before {
        content: '';
        width: 3px;
        height: 14px;
        background: var(--cyan);
        border-radius: 2px;
      }
      .panel-sub {
        font-size: 11px;
        color: var(--text-muted);
        margin-left: auto;
        letter-spacing: 0;
      }

      .legend-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* 护理人员看护统计：面板占满剩余空间，人数多时列表内部滚动 */
      .panel-grow {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #nurseStatList {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding-right: 4px;
        scrollbar-width: thin;
        scrollbar-color: rgba(64, 158, 255, 0.35) transparent;
      }
      #nurseStatList::-webkit-scrollbar {
        width: 6px;
      }
      #nurseStatList::-webkit-scrollbar-thumb {
        background: rgba(64, 158, 255, 0.35);
        border-radius: 3px;
      }
      #nurseStatList::-webkit-scrollbar-track {
        background: transparent;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }
      .legend-item .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        box-shadow: 0 0 6px currentColor;
      }
      .legend-item .lg-name {
        flex: 1;
        color: var(--text);
      }
      .legend-item .lg-count {
        font-family: 'Courier New', monospace;
        font-weight: 700;
      }

      .floor-stat-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }
      .floor-stat-item .fs-icon {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        flex-shrink: 0;
      }
      .floor-stat-item .fs-name {
        flex: 1;
        color: var(--text);
      }
      .floor-stat-item .fs-val {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        font-size: 16px;
      }

      .status-bar {
        height: 6px;
        border-radius: 3px;
        background: rgba(5, 11, 26, 0.6);
        overflow: hidden;
        margin-top: 6px;
        display: flex;
      }
      .status-bar > div {
        height: 100%;
        transition: width 0.4s;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(5, 11, 26, 0.4);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--cyan);
      }

      .empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
        font-size: 14px;
        flex-direction: column;
        gap: 12px;
      }
      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(12, 27, 54, 0.95);
        border: 1px solid var(--cyan);
        color: var(--cyan);
        padding: 10px 20px;
        border-radius: 6px;
        z-index: 100;
        font-size: 13px;
        box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
      }

      @media (max-width: 1100px) {
        .main {
          grid-template-columns: 1fr;
        }
        .stats {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* ---- 密码验证弹窗 ---- */
      .pwd-mask {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 11, 26, 0.92);
        backdrop-filter: blur(6px);
      }
      .pwd-mask.hidden {
        display: none;
      }
      .pwd-box {
        width: 340px;
        padding: 32px 28px 26px;
        background: var(--bg-1);
        border: 1px solid rgba(64, 158, 255, 0.35);
        border-radius: 12px;
        box-shadow: 0 0 40px rgba(0, 120, 255, 0.15);
        text-align: center;
      }
      .pwd-box .pwd-logo {
        font-size: 34px;
        margin-bottom: 10px;
      }
      .pwd-box h2 {
        margin: 0 0 6px;
        font-size: 18px;
        color: #dce8ff;
        letter-spacing: 2px;
      }
      .pwd-box .pwd-tip {
        font-size: 12px;
        color: var(--text-muted, #7a8db5);
        margin-bottom: 18px;
      }
      .pwd-box input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        font-size: 15px;
        color: #dce8ff;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(64, 158, 255, 0.35);
        border-radius: 8px;
        outline: none;
        text-align: center;
        letter-spacing: 2px;
      }
      .pwd-box input:focus {
        border-color: #409eff;
        box-shadow: 0 0 8px rgba(64, 158, 255, 0.35);
      }
      .pwd-box .pwd-err {
        height: 18px;
        margin: 8px 0 2px;
        font-size: 12px;
        color: #ff5b5b;
        visibility: hidden;
      }
      .pwd-box .pwd-err.show {
        visibility: visible;
      }
      .pwd-box button {
        width: 100%;
        margin-top: 10px;
        padding: 10px 0;
        font-size: 15px;
        letter-spacing: 4px;
        color: #fff;
        background: linear-gradient(135deg, #1677ff, #409eff);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .pwd-box button:hover {
        filter: brightness(1.12);
      }
      .pwd-box button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .pwd-box input[type='checkbox'] {
        width: auto;
        padding: 0;
        margin: 0;
        accent-color: #409eff;
      }
      .pwd-remember {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--text-muted, #7a8db5);
        cursor: pointer;
        user-select: none;
      }
      .pwd-box.shake {
        animation: pwd-shake 0.4s;
      }
      @keyframes pwd-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-8px);
        }
        50% {
          transform: translateX(8px);
        }
        75% {
          transform: translateX(-5px);
        }
      }
    </style>
  </head>
  <body>
    <!-- 访问密码弹窗：校验通过后才加载数据 -->
    <div class="pwd-mask" id="pwdMask">
      <div class="pwd-box" id="pwdBox">
        <div class="pwd-logo">🔐</div>
        <h2>访问验证</h2>
        <div class="pwd-tip">阳春市福颐康乐养老中心床位智慧大屏</div>
        <input type="text" id="accInput" placeholder="请输入账号" autocomplete="off" />
        <input type="password" id="pwdInput" placeholder="请输入密码" autocomplete="off" style="margin-top: 10px" />
        <label class="pwd-remember"><input type="checkbox" id="rememberChk" />记住密码（7天内免登录）</label>
        <div class="pwd-err" id="pwdErr">账号或密码错误，请重试</div>
        <button id="pwdBtn">进入系统</button>
      </div>
    </div>

    <div class="app">
      <div class="header">
        <div class="title-wrap" id="titleArea" title="点击刷新数据" style="cursor: pointer">
          <div class="logo">福</div>
          <div>
            <div class="title">阳春市福颐康乐养老中心床位智慧大屏</div>
            <div class="subtitle">YANGCHUN FUYI KANGLE NURSING CENTER BED MONITORING · VIKA</div>
          </div>
        </div>
        <div class="header-right">
          <div class="clock" id="clock">--:--:--</div>
        </div>
      </div>

      <!-- v3: 顶部统计为全表汇总（不随楼层切换变化） -->
      <div class="stats" id="stats"></div>

      <div class="main">
        <div class="floor-section">
          <div class="floor-tabs" id="floorTabs"></div>
          <!-- 护理人员条件筛选（默认全部），位于楼层平面图上方 -->
          <div class="nurse-bar" id="nurseBar"></div>
          <!-- 状态条件筛选（默认全部），位于护理人员筛选下方 -->
          <div class="nurse-bar" id="statusFilterBar"></div>
          <div class="floor-canvas-wrap">
            <div class="floor-canvas" id="floorCanvas"></div>
          </div>
        </div>

        <div class="side">
          <!-- v3: 当前楼层统计（寝室总数、床位总数），排版与状态分布一致 -->
          <div class="panel">
            <div class="panel-title">
              楼层统计
              <span class="panel-sub" id="floorStatSub">--</span>
            </div>
            <div class="legend-list" id="floorStatList"></div>
          </div>

          <div class="panel">
            <div class="panel-title">
              状态分布
              <span class="panel-sub" id="statusSub">--</span>
            </div>
            <div class="legend-list" id="legendList"></div>
            <div class="status-bar" id="statusBar"></div>
          </div>

          <div class="panel panel-grow">
            <div class="panel-title">
              护理人员看护统计
              <span class="panel-sub" id="nurseStatSub">--</span>
            </div>
            <div class="legend-list" id="nurseStatList"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      /* ============================================================
       *  v3 数据模型
       *  状态：入住 / 空闲 / 住院 / 请假
       * ============================================================ */
      const STATUS_CONFIG = [
        { key: '入住', cls: 'occupied', color: '#00e676', label: '入住' },
        { key: '空闲', cls: 'free', color: '#607d8b', label: '空闲' },
        { key: '住院', cls: 'hospital', color: '#ff6d00', label: '住院' },
        { key: '请假', cls: 'leave', color: '#448aff', label: '请假' },
      ];
      const STATUS_MAP = Object.fromEntries(STATUS_CONFIG.map((s) => [s.key, s]));

      let DATA = { floors: [], rooms: [], members: [], nurses: [] };
      const ALL_FLOOR = '__ALLFLOOR__'; // 楼层「全部」选项值
      let currentFloor = null;
      let currentNurse = '__ALL__'; // 当前筛选的护理人员，__ALL__ 为全部
      let currentStatus = '__ALL__'; // 当前筛选的状态，__ALL__ 为全部

      /* ============================================================
       *  Clock
       * ============================================================ */
      function tickClock() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        document.getElementById('clock').textContent =
          `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      }
      setInterval(tickClock, 1000);
      tickClock();

      /* ============================================================
       *  Toast
       * ============================================================ */
      let toastTimer;
      function toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
      }

      /* ============================================================
       *  Vika data loading (v2)
       *  从维格表 API 实时读取：楼层 / 寝室 / 护理人员 / 成员
       * ============================================================ */
      const VIKA_TOKEN = 'uskSHFVWmChwNjJ8gChAHPL';
      const VIKA_TABLES = {
        floors: { dst: 'dstBkEGEBGKcLTvqKy', view: 'viwZC0LiAtkoj' }, // 楼层表
        rooms: { dst: 'dsto9jiPmQFbiR3oST', view: 'viwPQFDWvyU0Q' }, // 寝室表
        nurses: { dst: 'dstQRNrGtJB2Nlhkzk', view: 'viwnZoYyfRGFY' }, // 护理人员表
        members: { dst: 'dstE5HsrwYXQXzVcjZ', view: 'viwsf4HovBWPE' }, // 成员表
      };
      const VIKA_ACCOUNTS = { dst: 'dstdusJ7NHAuorz5Ka', view: 'viwFiH2qX5S6c' }; // 账号表
      const AUTH_KEY = 'vika_auth';
      const REMEMBER_DAYS = 7;
      // 拉取单张表全部记录（自动分页）
      const VIKA_PAGE_SIZE = 500; // 每页请求条数（Vika 上限 1000）
      async function fetchAllRecords({ dst, view }) {
        const all = [];
        let page = 1;
        while (true) {
          const url = `https://api.vika.cn/fusion/v1/datasheets/${dst}/records?viewId=${view}&fieldKey=name&pageSize=${VIKA_PAGE_SIZE}&pageNum=${page}`;
          const res = await fetch(url, { headers: { Authorization: 'Bearer ' + VIKA_TOKEN } });
          const json = await res.json();
          if (json.code !== 200) throw new Error(json.message || 'Vika API error');
          const records = json.data.records || [];
          all.push(...records);
          // 停止条件：已收集的记录数达到 total，或本页返回空（防御死循环）
          if (all.length >= json.data.total || records.length === 0) break;
          page++;
        }
        return all;
      }

      const firstLink = (v) => (Array.isArray(v) && v.length ? v[0] : '');
      const txt = (v) => String(v ?? '').trim();
      const num = (v) => parseInt(v, 10) || 0;

      // Vika 记录 -> 页面 DATA 结构（与 Excel 版保持一致）
      function buildData(floorRecs, roomRecs, nurseRecs, memberRecs) {
        // recordId -> 楼层 {id, name}
        const floorMap = {};
        floorRecs.forEach((r) => {
          floorMap[r.recordId] = { id: txt(r.fields['楼层编号']), name: txt(r.fields['楼层名称']) };
        });
        // recordId -> 护理人员姓名
        const nurseMap = {};
        nurseRecs.forEach((r) => {
          nurseMap[r.recordId] = txt(r.fields['姓名']);
        });

        const floors = floorRecs
          .map((r) => floorMap[r.recordId])
          .filter((f) => f.id)
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        const nurses = nurseRecs
          .map((r) => ({
            id: txt(r.fields['工号']),
            name: txt(r.fields['姓名']),
            gender: txt(r.fields['性别']),
            phone: txt(r.fields['电话']),
            note: txt(r.fields['备注']),
          }))
          .filter((n) => n.name);

        // 寝室：楼层/护理人员为关联字段（recordId），映射回文本
        const roomMap = {}; // recordId -> room
        const rooms = [];
        roomRecs.forEach((r) => {
          const f = r.fields;
          const floorRec = firstLink(f['楼层']);
          // 注意：Vika 寝室表中该字段名带尾随空格
          const nurseRec = firstLink(f['护理人员 '] ?? f['护理人员']);
          const room = {
            floor: floorRec && floorMap[floorRec] ? floorMap[floorRec].id : '',
            no: txt(f['寝室编号']),
            name: txt(f['寝室名称']) || txt(f['寝室编号']),
            beds: num(f['床位数']),
            nurse: nurseRec ? nurseMap[nurseRec] || '' : '',
          };
          roomMap[r.recordId] = room;
          if (room.floor && room.no) rooms.push(room);
        });
        rooms.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        // 成员：寝室为关联字段，楼层通过寝室间接得到
        const members = [];
        memberRecs.forEach((r) => {
          const f = r.fields;
          const name = txt(f['姓名']);
          const room = roomMap[firstLink(f['寝室'])];
          if (!name || !room || !room.floor || !room.no) return;
          members.push({
            floor: room.floor,
            room: room.no,
            bed: num(f['床位号']),
            name,
            gender: txt(f['性别']),
            age: num(f['年龄']),
            status: txt(f['状态']) || '入住',
            note: txt(f['备注']),
          });
        });

        return { floors, rooms, members, nurses };
      }

      let isFirstLoad = true;
      async function loadFromVika(silent) {
        try {
          const [floorRecs, roomRecs, nurseRecs, memberRecs] = await Promise.all(
            [VIKA_TABLES.floors, VIKA_TABLES.rooms, VIKA_TABLES.nurses, VIKA_TABLES.members].map(fetchAllRecords),
          );
          DATA = buildData(floorRecs, roomRecs, nurseRecs, memberRecs);
          if (DATA.floors.length === 0) {
            if (!silent) toast('未读取到楼层数据');
            return;
          }
          if (isFirstLoad) {
            currentFloor = DATA.floors[0].id;
            currentNurse = '__ALL__';
            isFirstLoad = false;
          } else if (currentFloor !== ALL_FLOOR && !DATA.floors.some((f) => f.id === currentFloor)) {
            // 刷新时若当前楼层已不存在，回退到第一层
            currentFloor = DATA.floors[0].id;
            currentNurse = '__ALL__';
          }
          render();
          if (!silent)
            toast(`数据加载成功：${DATA.floors.length}层 / ${DATA.rooms.length}间 / ${DATA.members.length}人`);
        } catch (e) {
          console.error('[Vika] 加载失败:', e);
          if (isFirstLoad) {
            document.getElementById('floorCanvas').innerHTML = '<div class="empty">数据加载失败，点击标题重试</div>';
          }
          if (!silent) toast('数据加载失败：' + e.message);
        }
      }

      /* ============================================================
       *  账号验证：从 Vika 账号表读取账号 + MD5密码 校验
       *  记住密码：勾选后 7 天内免登录（localStorage），否则仅本次会话（sessionStorage）
       * ============================================================ */
      // 轻量 MD5（用于与账号表中的密码摘要比对）
      function md5(str) {
        function rotl(x, c) {
          return (x << c) | (x >>> (32 - c));
        }
        const bytes = [];
        for (let i = 0; i < str.length; i++) {
          const c = str.charCodeAt(i);
          if (c < 0x80) bytes.push(c);
          else if (c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
          else bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
        }
        const bitLen = bytes.length * 8;
        bytes.push(0x80);
        while (bytes.length % 64 !== 56) bytes.push(0);
        for (let i = 0; i < 8; i++) bytes.push(Math.floor(bitLen / 2 ** (8 * i)) & 0xff);
        const S = [
          7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9,
          14, 20, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15,
          21, 6, 10, 15, 21,
        ];
        const K = [];
        for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296);
        let a0 = 0x67452301,
          b0 = 0xefcdab89,
          c0 = 0x98badcfe,
          d0 = 0x10325476;
        for (let off = 0; off < bytes.length; off += 64) {
          const M = [];
          for (let j = 0; j < 16; j++)
            M[j] =
              bytes[off + j * 4] |
              (bytes[off + j * 4 + 1] << 8) |
              (bytes[off + j * 4 + 2] << 16) |
              (bytes[off + j * 4 + 3] << 24) |
              0;
          let A = a0,
            B = b0,
            C = c0,
            D = d0;
          for (let i = 0; i < 64; i++) {
            let F, g;
            if (i < 16) {
              F = (B & C) | (~B & D);
              g = i;
            } else if (i < 32) {
              F = (D & B) | (~D & C);
              g = (5 * i + 1) % 16;
            } else if (i < 48) {
              F = B ^ C ^ D;
              g = (3 * i + 5) % 16;
            } else {
              F = C ^ (B | ~D);
              g = (7 * i) % 16;
            }
            const tmp = D;
            D = C;
            C = B;
            B = (B + rotl((A + F + K[i] + M[g]) | 0, S[i])) | 0;
            A = tmp;
          }
          a0 = (a0 + A) | 0;
          b0 = (b0 + B) | 0;
          c0 = (c0 + C) | 0;
          d0 = (d0 + D) | 0;
        }
        const hex = (n) => {
          let s = '';
          for (let i = 0; i < 4; i++) s += ('0' + ((n >>> (8 * i)) & 0xff).toString(16)).slice(-2);
          return s;
        };
        return hex(a0) + hex(b0) + hex(c0) + hex(d0);
      }

      let unlocked = false; // 校验通过后为 true

      // 校验账号：账号 + 密码摘要作为服务端筛选条件，只返回 账号/备注 字段（不回传密码与创建时间）
      async function validateAccount(acc, pwdHash) {
        const safeAcc = String(acc).replace(/"/g, '\\"'); // 防引号注入公式
        const formula = `AND({账号}="${safeAcc}",{密码}="${String(pwdHash).toLowerCase()}")`;
        const url = `https://api.vika.cn/fusion/v1/datasheets/${VIKA_ACCOUNTS.dst}/records?viewId=${VIKA_ACCOUNTS.view}&fieldKey=name&fields=${encodeURIComponent('账号,备注')}&filterByFormula=${encodeURIComponent(formula)}&pageSize=1`;
        const res = await fetch(url, { headers: { Authorization: 'Bearer ' + VIKA_TOKEN } });
        const json = await res.json();
        if (json.code !== 200) throw new Error(json.message || 'Vika API error');
        return (json.data.records || []).length > 0; // 有记录即账号密码匹配
      }

      // 操作日志：登录成功后静默写入日志表（失败不影响主流程）
      // attempt 用于 429 限流重试（该空间限流较严，重试避免日志丢失）
      function logLogin(acc, attempt) {
        attempt = attempt || 0;
        fetch('https://api.vika.cn/fusion/v1/datasheets/dstHNa9upRKXQFjL5b/records', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + VIKA_TOKEN, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            records: [
              {
                fields: {
                  账号: acc,
                  操作表单: '床位智慧大屏',
                  操作类型: '用户登录',
                  操作时间: Date.now(),
                },
              },
            ],
          }),
        })
          .then((r) => r.json())
          .then((json) => {
            if (json.code !== 200 && attempt < 4) setTimeout(() => logLogin(acc, attempt + 1), 1200 * (attempt + 1));
          })
          .catch(() => {
            if (attempt < 4) setTimeout(() => logLogin(acc, attempt + 1), 1200 * (attempt + 1));
          });
      }

      function saveAuth(account, hash, remember) {
        const exp = Date.now() + REMEMBER_DAYS * 86400000;
        const payload = JSON.stringify({ account, hash, expire: exp });
        const adminPayload = JSON.stringify({ acc: account, hash, expires: exp }); // 兼容 admin.html
        if (remember) {
          localStorage.setItem(AUTH_KEY, payload);
          localStorage.setItem('vika_admin_auth', adminPayload);
          sessionStorage.removeItem(AUTH_KEY);
          sessionStorage.removeItem('vika_admin_session');
        } else {
          sessionStorage.setItem(AUTH_KEY, payload);
          sessionStorage.setItem('vika_admin_session', adminPayload);
          localStorage.removeItem(AUTH_KEY);
          localStorage.removeItem('vika_admin_auth');
        }
      }
      function loadAuth() {
        // 跨页免登录：同时识别本页与 admin.html 的登录态格式
        const candidates = [
          { store: localStorage, key: AUTH_KEY },
          { store: sessionStorage, key: AUTH_KEY },
          { store: localStorage, key: 'vika_admin_auth' },
          { store: sessionStorage, key: 'vika_admin_session' },
        ];
        for (const { store, key } of candidates) {
          try {
            const raw = store.getItem(key);
            if (!raw) continue;
            const o = JSON.parse(raw);
            const account = o.account || o.acc;
            const expire = o.expire || o.expires;
            if (account && o.hash && expire > Date.now()) return { account, hash: o.hash, expire };
            store.removeItem(key); // 过期清理
          } catch (e) {
            /* 忽略损坏数据 */
          }
        }
        return null;
      }
      function clearAuth() {
        localStorage.removeItem(AUTH_KEY);
        localStorage.removeItem('vika_admin_auth');
        sessionStorage.removeItem(AUTH_KEY);
        sessionStorage.removeItem('vika_admin_session');
      }

      function enterSystem() {
        unlocked = true;
        document.getElementById('pwdMask').classList.add('hidden');
        loadFromVika(false); // 校验通过，开始加载数据
      }

      function showAuthError(msg) {
        const err = document.getElementById('pwdErr');
        err.textContent = msg;
        err.classList.add('show');
        const box = document.getElementById('pwdBox');
        box.classList.remove('shake');
        void box.offsetWidth; // 重启动画
        box.classList.add('shake');
      }

      async function checkPassword() {
        const acc = document.getElementById('accInput').value.trim();
        const pwd = document.getElementById('pwdInput').value;
        const remember = document.getElementById('rememberChk').checked;
        if (!acc || !pwd) {
          showAuthError('请输入账号和密码');
          return;
        }
        const btn = document.getElementById('pwdBtn');
        btn.disabled = true;
        btn.textContent = '验证中…';
        try {
          const hash = md5(pwd);
          if (await validateAccount(acc, hash)) {
            saveAuth(acc, hash, remember);
            enterSystem();
            logLogin(acc);
          } else {
            clearAuth();
            showAuthError('账号或密码错误，请重试');
            document.getElementById('pwdInput').value = '';
            document.getElementById('pwdInput').focus();
          }
        } catch (e) {
          showAuthError('网络异常，无法连接验证服务');
        } finally {
          btn.disabled = false;
          btn.textContent = '进入系统';
        }
      }

      document.getElementById('pwdBtn').addEventListener('click', checkPassword);
      document.getElementById('pwdInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkPassword();
      });
      document.getElementById('accInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkPassword();
      });

      // 已保存的有效登录：静默复核账号仍有效后直接进入；网络异常时宽限进入（大屏场景）
      (async function autoLogin() {
        const auth = loadAuth();
        if (!auth) {
          document.getElementById('accInput').focus();
          return;
        }
        try {
          if (await validateAccount(auth.account, auth.hash)) {
            logLogin(auth.account); // 免登录进入同样记录
            return enterSystem();
          }
          clearAuth(); // 账号被删除或密码已改，重新登录
          document.getElementById('accInput').focus();
        } catch (e) {
          logLogin(auth.account); // 离线宽限进入同样记录
          enterSystem(); // 离线宽限
        }
      })();

      // 点击标题手动刷新（仅密码校验通过后生效）
      // document.getElementById('titleArea').addEventListener('click', () => {
      //   if (!unlocked) return;
      //   toast('正在刷新数据…');
      //   loadFromVika(false);
      // });

      /* ============================================================
       *  Rendering
       * ============================================================ */
      function getFloorRooms(floorId) {
        return floorId === ALL_FLOOR ? DATA.rooms : DATA.rooms.filter((r) => r.floor === floorId);
      }
      function getRoomMembers(floorId, roomNo) {
        return DATA.members.filter((m) => m.floor === floorId && m.room === roomNo).sort((a, b) => a.bed - b.bed);
      }
      function getFloorMembers(floorId) {
        return floorId === ALL_FLOOR ? DATA.members : DATA.members.filter((m) => m.floor === floorId);
      }

      /* 当前楼层显示名（用于面板标题右侧标注） */
      function currentFloorName() {
        if (currentFloor === ALL_FLOOR) return '全部楼层';
        const f = DATA.floors.find((f) => f.id === currentFloor);
        return f ? f.name || f.id : '';
      }

      function renderFloorTabs() {
        const box = document.getElementById('floorTabs');
        box.innerHTML = '';
        // 「全部」放在第一位，默认选中第二个选项（第一个实际楼层）
        const allTab = document.createElement('div');
        allTab.className = 'floor-tab' + (currentFloor === ALL_FLOOR ? ' active' : '');
        allTab.innerHTML = `<span class="tab-name">全部</span><span class="tab-desc">所有楼层</span>`;
        allTab.onclick = () => {
          currentFloor = ALL_FLOOR;
          currentNurse = '__ALL__';
          render();
        };
        box.appendChild(allTab);
        DATA.floors.forEach((f) => {
          const tab = document.createElement('div');
          tab.className = 'floor-tab' + (f.id === currentFloor ? ' active' : '');
          tab.innerHTML = `<span class="tab-name">${f.name || f.id}</span><span class="tab-desc">${f.desc || ''}</span>`;
          tab.onclick = () => {
            currentFloor = f.id;
            currentNurse = '__ALL__';
            render();
          };
          box.appendChild(tab);
        });
      }

      /* 当前楼层实际负责寝室的护理人员（按首次出现顺序去重） */
      function getFloorNurses(floorId) {
        const list = [];
        getFloorRooms(floorId).forEach((r) => {
          if (r.nurse && !list.includes(r.nurse)) list.push(r.nurse);
        });
        return list;
      }

      /* 寝室区下方：护理人员筛选条，默认「全部」 */
      function renderNurseFilter() {
        const box = document.getElementById('nurseBar');
        const nurses = getFloorNurses(currentFloor);
        // 当前选择的人已不在该楼层时，回退到全部
        if (currentNurse !== '__ALL__' && !nurses.includes(currentNurse)) currentNurse = '__ALL__';

        const chips = [{ v: '__ALL__', label: '全部' }, ...nurses.map((n) => ({ v: n, label: n }))];
        box.innerHTML =
          '<span class="nurse-bar-label">护理人员</span>' +
          chips
            .map(
              (c) =>
                `<span class="nurse-chip${currentNurse === c.v ? ' active' : ''}" data-nurse="${c.v}">${c.label}</span>`,
            )
            .join('');
        box.querySelectorAll('.nurse-chip').forEach((chip) => {
          chip.onclick = () => {
            currentNurse = chip.dataset.nurse;
            render();
          };
        });
      }

      /* 状态筛选条（护理人员筛选下方）：全部/入住/请假/住院/空闲，默认全部 */
      function renderStatusFilter() {
        const box = document.getElementById('statusFilterBar');
        const opts = ['__ALL__', '入住', '请假', '住院', '空闲'];
        box.innerHTML =
          '<span class="nurse-bar-label">状态</span>' +
          opts
            .map(
              (v) =>
                `<span class="nurse-chip${currentStatus === v ? ' active' : ''}" data-status="${v}">${v === '__ALL__' ? '全部' : v}</span>`,
            )
            .join('');
        box.querySelectorAll('.nurse-chip').forEach((chip) => {
          chip.onclick = () => {
            currentStatus = chip.dataset.status;
            render();
          };
        });
      }

      /* v3: 顶部统计 = 全表汇总（所有楼层，不随楼层切换变化） */
      function renderStats() {
        const members = DATA.members;
        const rooms = DATA.rooms;
        const totalBeds = rooms.reduce((s, r) => s + r.beds, 0);

        const counts = { 入住: 0, 空闲: 0, 住院: 0, 请假: 0 };
        members.forEach((m) => {
          if (counts[m.status] !== undefined) counts[m.status]++;
        });
        const freeBeds = Math.max(0, totalBeds - members.length);

        const cards = [
          { icon: '🏠', label: '寝室总数', val: rooms.length, color: '#3a9bff' },
          { icon: '🛏️', label: '床位总数', val: totalBeds, color: '#00e5ff' },
          { icon: '✅', label: '入住人数', val: counts['入住'], color: '#00e676' },
          { icon: '⬜', label: '空闲床位', val: freeBeds, color: '#607d8b' },
          { icon: '🏥', label: '住院人数', val: counts['住院'], color: '#ff6d00' },
          { icon: '🏖️', label: '请假人数', val: counts['请假'], color: '#448aff' },
        ];
        const box = document.getElementById('stats');
        box.innerHTML = cards
          .map(
            (c) => `
    <div class="stat-card">
      <div class="stat-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
      <div class="stat-info">
        <div class="stat-val" style="color:${c.color}">${c.val}</div>
        <div class="stat-label">${c.label}</div>
      </div>
    </div>
  `,
          )
          .join('');
      }

      /* v3: 当前楼层统计（寝室总数、床位总数），放右侧状态分布上方 */
      function renderFloorStats() {
        const rooms = getFloorRooms(currentFloor);
        const totalBeds = rooms.reduce((s, r) => s + r.beds, 0);
        const sub = document.getElementById('floorStatSub');
        if (sub) sub.textContent = currentFloorName();

        const items = [
          { icon: '🏠', name: '寝室总数', val: rooms.length, color: '#3a9bff' },
          { icon: '🛏️', name: '床位总数', val: totalBeds, color: '#00e5ff' },
        ];
        const list = document.getElementById('floorStatList');
        list.innerHTML = items
          .map(
            (it) => `
    <div class="floor-stat-item">
      <div class="fs-icon" style="background:${it.color}22;color:${it.color}">${it.icon}</div>
      <span class="fs-name">${it.name}</span>
      <span class="fs-val" style="color:${it.color}">${it.val}</span>
    </div>
  `,
          )
          .join('');
      }

      /* v3: 寝室自适应排列 —— 不再使用 Excel 的行/列坐标，自动流式布局 */
      function renderFloor() {
        const canvas = document.getElementById('floorCanvas');
        // 按当前护理人员筛选
        let rooms = getFloorRooms(currentFloor);
        if (currentNurse !== '__ALL__') rooms = rooms.filter((r) => r.nurse === currentNurse);

        // 自适应网格，无需设置行/列，由 CSS auto-fill 自动排列
        canvas.style.gridTemplateColumns = '';
        canvas.innerHTML = '';

        if (rooms.length === 0) {
          canvas.innerHTML =
            currentNurse !== '__ALL__'
              ? `<div class="empty">护理人员「${currentNurse}」在当前范围暂无负责寝室</div>`
              : '<div class="empty">当前范围暂无寝室数据</div>';
          return;
        }

        let rendered = 0;
        rooms.forEach((r) => {
          // 成员按寝室自身的楼层匹配（「全部」楼层时房号可能跨层重复）
          const members = getRoomMembers(r.floor, r.no);
          const occupied = members.length;
          const freeCount = Math.max(0, r.beds - members.length);

          // 状态筛选：空闲=只看空床位；入住/请假/住院=只看该状态成员（不显示空床）
          let showMembers = members;
          let showFree = freeCount;
          if (currentStatus === '空闲') {
            showMembers = [];
          } else if (currentStatus !== '__ALL__') {
            showMembers = members.filter((m) => m.status === currentStatus);
            showFree = 0;
          }
          // 状态筛选下该寝室无匹配床位 → 跳过不显示
          if (currentStatus !== '__ALL__' && showMembers.length + showFree === 0) return;

          const el = document.createElement('div');
          el.className = 'room';

          let bedsHtml = '';
          if (r.beds > 0) {
            // 先展示筛选后的成员床位（getRoomMembers 已按床位号排序）
            showMembers.forEach((m) => {
              const st = STATUS_MAP[m.status] || STATUS_MAP['入住'];
              bedsHtml += `<div class="bed" title="${m.name} | ${m.gender} ${m.age}岁 | ${m.status}${m.note ? ' | ' + m.note : ''}">
            <span class="dot ${st.cls}"></span>
            <span class="bno">${m.bed}床</span>
            <span class="bname">${m.name}</span>
            <span class="bst">${m.status}</span>
          </div>`;
            });
            // 补足空闲床位
            for (let i = 0; i < showFree; i++) {
              bedsHtml += `<div class="bed" title="空闲床位">
            <span class="dot free"></span>
            <span class="bname" style="color:var(--text-muted)">空闲床位</span>
            <span class="bst">空闲</span>
          </div>`;
            }
          } else {
            bedsHtml = `<div class="bed" style="color:var(--text-muted)"><span class="bname">无床位</span></div>`;
          }

          const nurseHtml = r.nurse
            ? `<span class="rnurse" title="护理人员：${r.nurse}">${r.nurse}</span>`
            : `<span class="rnurse none" title="未分配护理人员">未分配</span>`;

          el.innerHTML = `
      <div class="room-head">
        <span class="rname">${r.name || r.no}<span class="rcount">${occupied}/${r.beds}</span></span>
        ${nurseHtml}
      </div>
      <div class="beds">
        ${bedsHtml}
      </div>
    `;
          canvas.appendChild(el);
          rendered++;
        });

        // 状态筛选后没有任何匹配
        if (rendered === 0) {
          canvas.innerHTML = `<div class="empty">当前筛选条件下暂无状态为「${currentStatus}」的床位</div>`;
        }
      }

      /* 右侧：护理人员看护统计（统计每位护理人员在当前楼层负责多少间寝室） */
      function renderNurseStats() {
        const sub = document.getElementById('nurseStatSub');
        if (sub) sub.textContent = currentFloorName();

        const counts = {};
        getFloorRooms(currentFloor).forEach((r) => {
          const n = r.nurse || '未分配';
          counts[n] = (counts[n] || 0) + 1;
        });
        const entries = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh'));

        const list = document.getElementById('nurseStatList');
        if (entries.length === 0) {
          list.innerHTML =
            '<div style="color:var(--text-muted);text-align:center;padding:14px;font-size:12px">暂无护理人员分配</div>';
          return;
        }
        const totalRooms = entries.reduce((s, e) => s + e[1], 0);
        list.innerHTML = entries
          .map(([name, cnt]) => {
            const unassigned = name === '未分配';
            const color = unassigned ? '#7d93b8' : '#ffd54f';
            return `
    <div class="nurse-stat-item" title="${name} 看护 ${cnt} 间（占该层 ${((cnt / totalRooms) * 100).toFixed(0)}%）">
      <span class="ns-name${unassigned ? ' ns-name-muted' : ''}">${name}</span>
      <span class="ns-val" style="color:${color}">${cnt}<span class="ns-unit">间</span></span>
    </div>`;
          })
          .join('');
      }

      function renderLegend() {
        const members = getFloorMembers(currentFloor);
        const rooms = getFloorRooms(currentFloor);
        const totalBeds = rooms.reduce((s, r) => s + r.beds, 0);

        const sub = document.getElementById('statusSub');
        if (sub) sub.textContent = currentFloorName();

        const counts = { 入住: 0, 空闲: 0, 住院: 0, 请假: 0 };
        members.forEach((m) => {
          if (counts[m.status] !== undefined) counts[m.status]++;
        });
        counts['空闲'] = Math.max(0, totalBeds - members.length);

        const total = totalBeds || 1;

        const list = document.getElementById('legendList');
        list.innerHTML = STATUS_CONFIG.map(
          (s) => `
    <div class="legend-item">
      <span class="dot ${s.cls}"></span>
      <span class="lg-name">${s.label}</span>
      <span class="lg-count" style="color:${s.color}">${counts[s.key]}</span>
    </div>
  `,
        ).join('');

        const bar = document.getElementById('statusBar');
        bar.innerHTML = STATUS_CONFIG.map(
          (s) =>
            `<div style="width:${((counts[s.key] / total) * 100).toFixed(1)}%;background:${s.color}" title="${s.label}: ${counts[s.key]}"></div>`,
        ).join('');
      }

      function render() {
        renderFloorTabs();
        renderStats(); // 全表汇总（不随楼层变）
        renderFloorStats(); // 当前楼层统计
        renderNurseFilter(); // 当前楼层护理人员筛选条
        renderStatusFilter(); // 状态筛选条
        renderFloor(); // 当前楼层寝室（按护理人员+状态筛选）
        renderLegend(); // 当前楼层状态分布
        renderNurseStats(); // 护理人员看护寝室统计
      }
    </script>
  </body>
</html>
