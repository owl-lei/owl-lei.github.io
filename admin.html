<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阳春市福颐康乐养老中心后台管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
      :root {
        --bg: #f2f4f8;
        --card: #ffffff;
        --line: #eef1f6;
        --text: #1f2d3d;
        --muted: #8a94a6;
        --primary: #2f6ef7;
        --primary-light: #7aa7ff;
        --green: #17b26a;
        --orange: #fa8c16;
        --red: #f04438;
        --purple: #7a5af8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          'PingFang SC',
          'Microsoft YaHei',
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        font-size: 14px;
      }
      /* ============ 顶部导航 ============ */
      .topbar {
        height: 56px;
        background: #fff;
        display: flex;
        align-items: center;
        padding: 0 20px;
        box-shadow: 0 1px 4px rgba(0, 21, 41, 0.08);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-right: 22px;
        flex-shrink: 0;
      }
      .brand-icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #2f6ef7, #6aa1ff);
        color: #fff;
        font-size: 15px;
      }
      .brand-name {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
      }
      .nav {
        display: flex;
        flex: 1;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .nav::-webkit-scrollbar {
        display: none;
      }
      .nav-item {
        padding: 0 15px;
        height: 56px;
        line-height: 56px;
        font-size: 14px;
        color: #5b6b82;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
        transition: color 0.15s;
      }
      .nav-item:hover {
        color: var(--primary);
      }
      .nav-item.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
        font-weight: 600;
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
      }
      .link-btn {
        font-size: 13px;
        color: #5b6b82;
        text-decoration: none;
        cursor: pointer;
        padding: 5px 10px;
        border-radius: 6px;
        transition: all 0.15s;
      }
      .link-btn:hover {
        color: var(--primary);
        background: #f0f5ff;
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        color: #fff;
        font-size: 13px;
        background: linear-gradient(135deg, #2f6ef7, #6aa1ff);
        display: grid;
        place-items: center;
        font-weight: 600;
        cursor: pointer;
      }
      .user-name {
        font-size: 13px;
        color: #5b6b82;
        cursor: pointer;
      }
      /* ============ 仪表盘 ============ */
      .dash {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 322px;
        gap: 16px;
        padding: 16px 20px 28px;
        align-items: stretch; /* 侧栏拉伸与主列同高，空床寝室卡片与寝室床位规模底部平齐 */
      }
      .dash-main {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .dash-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .card {
        background: var(--card);
        border-radius: 10px;
        padding: 16px;
        box-shadow: 0 1px 4px rgba(0, 21, 41, 0.06);
        min-width: 0;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .card-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
      }
      .card-title::before {
        content: '';
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 32%, #cfe0ff, #2f6ef7 70%);
        box-shadow: 0 0 0 3px rgba(47, 110, 247, 0.1);
      }
      .card-sub {
        font-size: 12px;
        color: var(--muted);
      }
      .card-tools {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mini-btn {
        border: none;
        background: #f0f5ff;
        color: var(--primary);
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .mini-btn:hover {
        background: #e0ebff;
      }
      /* 指标条 */
      .metrics {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
      }
      .metric {
        padding: 2px 16px;
        border-left: 1px dashed #e6eaf2;
        min-width: 0;
      }
      .metric:first-child {
        border-left: none;
        padding-left: 0;
      }
      .metric-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        white-space: nowrap;
      }
      .metric-label i {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        display: grid;
        place-items: center;
        font-size: 10px;
        font-style: normal;
        background: #f0f5ff;
        color: var(--primary);
        flex-shrink: 0;
      }
      .metric-value {
        font-size: 26px;
        font-weight: 700;
        line-height: 1.25;
        color: var(--text);
        white-space: nowrap;
      }
      .metric-value small {
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
        margin-left: 3px;
      }
      .metric-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        white-space: nowrap;
      }
      .metric-sub b {
        font-weight: 600;
      }
      .metric-sub .up {
        color: var(--green);
      }
      .metric-sub .down {
        color: var(--red);
      }
      /* 图表 */
      .chart {
        height: 230px;
        width: 100%;
      }
      .chart-sm {
        height: 210px;
        width: 100%;
      }
      .chart-empty {
        height: 230px;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }
      /* 护理员进度排行 */
      .rank {
        display: flex;
        flex-direction: column;
        gap: 11px;
        padding-top: 2px;
        max-height: 262px;
        overflow-y: auto;
        padding-right: 8px;
      }
      .rank::-webkit-scrollbar {
        width: 5px;
      }
      .rank::-webkit-scrollbar-thumb {
        background: #d7dfeb;
        border-radius: 3px;
      }
      .rank-item {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .rank-name {
        width: 56px;
        flex-shrink: 0;
        font-size: 12px;
        color: #5b6b82;
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rank-track {
        flex: 1;
        height: 8px;
        border-radius: 5px;
        background: #eef1f6;
        overflow: hidden;
      }
      .rank-fill {
        height: 100%;
        border-radius: 5px;
        background: linear-gradient(90deg, #7aa7ff, #2f6ef7);
        transition: width 0.4s;
      }
      .rank-val {
        width: 86px;
        flex-shrink: 0;
        font-size: 12px;
        color: var(--text);
        text-align: right;
        white-space: nowrap;
      }
      .rank-val small {
        color: var(--muted);
        font-size: 11px;
        margin-left: 2px;
      }
      /* 右侧栏 */
      .dash-side {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .welcome {
        border-radius: 10px;
        padding: 20px;
        color: #fff;
        position: relative;
        overflow: hidden;
        background: linear-gradient(120deg, #2f6ef7 0%, #5b8cff 55%, #93b8ff 100%);
        box-shadow: 0 4px 14px rgba(47, 110, 247, 0.28);
        min-height: 132px;
      }
      .welcome::after {
        content: '';
        position: absolute;
        right: -36px;
        top: -36px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
      }
      .welcome::before {
        content: '';
        position: absolute;
        right: 34px;
        bottom: -56px;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
      }
      .welcome .hi {
        font-size: 17px;
        font-weight: 600;
        margin-bottom: 8px;
        position: relative;
        z-index: 1;
      }
      .welcome .date {
        font-size: 13px;
        opacity: 0.92;
        position: relative;
        z-index: 1;
      }
      .welcome .desc {
        font-size: 12px;
        opacity: 0.85;
        margin-top: 10px;
        position: relative;
        z-index: 1;
        line-height: 1.6;
      }
      .welcome .icon {
        position: absolute;
        right: 22px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 44px;
        z-index: 1;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12));
      }
      /* 侧栏列表 */
      .side-list {
        display: flex;
        flex-direction: column;
      }
      /* 空床寝室滚动条与护理人员看护寝室数(.rank)保持一致 */
      #emptyRooms {
        padding-right: 8px;
      }
      #emptyRooms::-webkit-scrollbar {
        width: 5px;
      }
      #emptyRooms::-webkit-scrollbar-thumb {
        background: #d7dfeb;
        border-radius: 3px;
      }
      .side-item {
        display: flex;
        gap: 10px;
        padding: 11px 0;
        border-bottom: 1px dashed var(--line);
      }
      .side-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .side-item:first-child {
        padding-top: 0;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-top: 6px;
        flex-shrink: 0;
      }
      .side-body {
        flex: 1;
        min-width: 0;
      }
      .side-name {
        font-size: 13px;
        color: var(--text);
        font-weight: 500;
        margin-bottom: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .side-meta {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 10px;
      }
      .side-num {
        font-size: 13px;
        color: var(--primary);
        font-weight: 600;
        flex-shrink: 0;
      }
      /* 侧栏小表格 */
      .mini-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .mini-table th {
        text-align: left;
        color: var(--muted);
        font-weight: 400;
        padding: 0 0 9px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .mini-table th:last-child,
      .mini-table td:last-child {
        text-align: right;
      }
      .mini-table td {
        padding: 9px 0;
        border-bottom: 1px dashed var(--line);
        color: #5b6b82;
      }
      .mini-table tr:last-child td {
        border-bottom: none;
        padding-bottom: 0;
      }
      .mini-table td b {
        color: var(--text);
        font-weight: 600;
      }
      /* ============ 表格页 ============ */
      .table-page {
        padding: 16px 20px 28px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .toolbar .count {
        font-size: 13px;
        color: var(--muted);
      }
      .toolbar .search {
        flex: 1;
        max-width: 300px;
        padding: 8px 12px;
        background: #fff;
        border: 1px solid #e2e8f2;
        border-radius: 6px;
        color: var(--text);
        font-size: 13px;
        outline: none;
        transition: border 0.15s;
      }
      .toolbar .search:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(47, 110, 247, 0.1);
      }
      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s;
        font-weight: 500;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: #255fe0;
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-danger {
        background: #fff1f0;
        color: var(--red);
        border: 1px solid #ffccc7;
      }
      .btn-danger:hover {
        background: #ffe4e1;
      }
      .btn-cancel {
        background: #f4f6fa;
        color: #5b6b82;
      }
      .btn-cancel:hover {
        background: #e9edf5;
      }
      .btn-sm {
        padding: 4px 11px;
        font-size: 12px;
      }
      .table-wrap {
        background: #fff;
        border-radius: 10px;
        overflow: auto;
        max-height: calc(100vh - 170px);
        box-shadow: 0 1px 4px rgba(0, 21, 41, 0.06);
      }
      table.data {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        table-layout: fixed;
      }
      table.data thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: #f7f9fc;
        padding: 8px 14px;
        text-align: left;
        color: #5b6b82;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        font-size: 12px;
        width: 110px;
      }
      table.data thead th:nth-last-child(2) {
        width: auto;
      }
      table.data thead th:last-child {
        width: 130px;
      }
      table.data tbody td {
        padding: 6px 14px;
        border-bottom: 1px solid var(--line);
        color: var(--text);
        white-space: nowrap;
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      table.data tbody tr:hover {
        background: #f7faff;
      }
      table.data tbody tr:last-child td {
        border-bottom: none;
      }
      .row-actions {
        display: flex;
        gap: 8px;
      }
      .empty,
      .loading {
        text-align: center;
        padding: 56px 20px;
        color: var(--muted);
        font-size: 13px;
      }
      .loading {
        display: none;
      }
      /* ============ 弹窗 ============ */
      .mask {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(15, 29, 52, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .mask.hidden {
        display: none;
      }
      .modal {
        width: 460px;
        max-width: 100%;
        max-height: 82vh;
        overflow-y: auto;
        background: #fff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 12px 40px rgba(0, 21, 41, 0.18);
        animation: pop 0.22s ease;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .modal-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 18px;
        color: var(--text);
      }
      .form-group {
        margin-bottom: 14px;
      }
      .form-group label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px 12px;
        background: #f7f9fc;
        border: 1px solid #e2e8f2;
        border-radius: 6px;
        color: var(--text);
        font-size: 13px;
        outline: none;
        transition: all 0.15s;
      }
      .form-group input:focus,
      .form-group select:focus {
        border-color: var(--primary);
        background: #fff;
        box-shadow: 0 0 0 2px rgba(47, 110, 247, 0.1);
      }
      .form-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 20px;
      }
      /* 登录 */
      .login-mask {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eef3fb, #e3ecfa);
      }
      .login-mask.hidden {
        display: none;
      }
      .login-box {
        width: 380px;
        max-width: 92vw;
        padding: 36px 32px;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 16px 48px rgba(21, 53, 110, 0.14);
        animation: pop 0.25s ease;
      }
      .login-logo {
        width: 52px;
        height: 52px;
        margin: 0 auto 14px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #2f6ef7, #6aa1ff);
        font-size: 26px;
      }
      .login-title {
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 4px;
      }
      .login-desc {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 24px;
      }
      .login-input {
        width: 100%;
        padding: 11px 13px;
        margin-bottom: 13px;
        background: #f7f9fc;
        border: 1px solid #e2e8f2;
        border-radius: 7px;
        color: var(--text);
        font-size: 14px;
        outline: none;
        transition: all 0.15s;
      }
      .login-input:focus {
        border-color: var(--primary);
        background: #fff;
        box-shadow: 0 0 0 2px rgba(47, 110, 247, 0.1);
      }
      .login-remember {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: #5b6b82;
        margin-bottom: 18px;
        cursor: pointer;
      }
      .login-remember input {
        accent-color: var(--primary);
      }
      .login-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 7px;
        background: var(--primary);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .login-btn:hover {
        background: #255fe0;
      }
      .login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .login-err {
        color: var(--red);
        font-size: 12px;
        text-align: center;
        margin-top: 12px;
        min-height: 17px;
      }
      .shake {
        animation: shake 0.4s;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20%,
        60% {
          transform: translateX(-8px);
        }
        40%,
        80% {
          transform: translateX(8px);
        }
      }
      /* Toast */
      .toast {
        position: fixed;
        top: 72px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        padding: 10px 22px;
        border-radius: 8px;
        font-size: 13px;
        box-shadow: 0 6px 20px rgba(0, 21, 41, 0.12);
        animation: toastIn 0.25s ease;
        pointer-events: none;
        background: #fff;
      }
      .toast.success {
        color: #0e7a4a;
        border: 1px solid #b7ebd0;
        background: #f0fbf5;
      }
      .toast.error {
        color: #b42318;
        border: 1px solid #ffccc7;
        background: #fff5f4;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }
      .confirm-box {
        width: 330px;
        max-width: 100%;
        padding: 24px;
        text-align: center;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 21, 41, 0.18);
      }
      .confirm-box .msg {
        font-size: 14px;
        color: var(--text);
        margin-bottom: 20px;
        line-height: 1.6;
      }
      .confirm-box .btns {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      /* 响应式 */
      @media (max-width: 1280px) {
        .dash {
          grid-template-columns: 1fr;
        }
        .dash-side {
          flex-direction: row;
          flex-wrap: wrap;
        }
        .dash-side > * {
          flex: 1 1 300px;
        }
      }
      @media (max-width: 900px) {
        .dash-row {
          grid-template-columns: 1fr;
        }
        .metrics {
          grid-template-columns: repeat(3, 1fr);
          row-gap: 16px;
        }
        .metric:nth-child(4) {
          border-left: none;
          padding-left: 0;
        }
        .brand-name {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- 登录 -->

      function md5(string) {
        function rl(n, c) {
          return (n << c) | (n >>> (32 - c));
        }
        function add(x, y) {
          var l = (x & 0xffff) + (y & 0xffff);
          var m = (x >> 16) + (y >> 16) + (l >> 16);
          return (m << 16) | (l & 0xffff);
        }
        function q(f, a, b, x, s, t) {
          return add(rl(add(add(a, f), add(x, t)), s), b);
        }
        function ff(a, b, c, d, x, s, t) {
          return q((b & c) | (~b & d), a, b, x, s, t);
        }
        function gg(a, b, c, d, x, s, t) {
          return q((b & d) | (c & ~d), a, b, x, s, t);
        }
        function hh(a, b, c, d, x, s, t) {
          return q(b ^ c ^ d, a, b, x, s, t);
        }
        function ii(a, b, c, d, x, s, t) {
          return q(c ^ (b | ~d), a, b, x, s, t);
        }
        function conv(str) {
          var w = [],
            i,
            n = str.length;
          for (i = 0; i < n; i++) w[i >> 2] = (w[i >> 2] || 0) | (str.charCodeAt(i) << ((i % 4) * 8));
          w[n >> 2] = (w[n >> 2] || 0) | (0x80 << ((n % 4) * 8));
          var len = ((n + 8) >> 6) * 16 + 16;
          for (i = 0; i < len; i++) w[i] = w[i] || 0;
          w[len - 2] = n * 8;
          return w;
        }
        var x = conv(string),

        for (var i = 0; i < x.length; i += 16) {

          a = add(a, oa);
          b = add(b, ob);
          c = add(c, oc);

        }
        return [a, b, c, d]

      /* ================= Vika API ================= */
      function vikaFetch(url, opts, retry) {
        opts = opts || {};
        opts.headers = opts.headers || {};
        opts.headers['Authorization'] = 'Bearer ' + VIKA_TOKEN;
        if (opts.body) opts.headers['Content-Type'] = 'application/json';
        if (retry === undefined) retry = 5;
        var backoff = function () {
          // 空间限流 2 QPS，退避间隔 1.2s 递增
          return new Promise(function (res) {
            setTimeout(res, (6 - retry) * 1200);
          });
        };
        return fetch(url, opts)
          .then(function (r) {
            return r.json();
          })
          .then(function (json) {
            // 维格表限流(429)或服务端错误时退避重试
            if (json && (json.code === 429 || json.code >= 500) && retry > 0) {
              return backoff().then(function () {
                return vikaFetch(url, opts, retry - 1);
              });
            }
            return json;
          })
          .catch(function (err) {
            if (retry > 0) {
              return backoff().then(function () {
                return vikaFetch(url, opts, retry - 1);
              });
            }
            throw err;
          });
      }

      function logOperation(type, tableLabel, beforeFields, afterFields) {

        }
        vikaFetch('https://api.vika.cn/fusion/v1/datasheets/' + LOG_TABLE.dst + '/records', {
          method: 'POST',
          body: JSON.stringify({ records: [{ fields: fields }] }),
        }).catch(function () {});

      function fetchAllRecords(key) {
        var t = TABLES[key],

        function next() {
          var url =
            'https://api.vika.cn/fusion/v1/datasheets/' +
            t.dst +
            '/records?viewId=' +
            t.view +
            '&fieldKey=name&pageSize=' +
            VIKA_PAGE_SIZE +
            '&pageNum=' +
            page;
          return vikaFetch(url).then(function (json) {
            if (json.code !== 200) throw new Error(json.message || 'Vika API error');
            var recs = json.data.records || [];
            all = all.concat(recs);
            if (all.length >= json.data.total || recs.length === 0) return all;
            page++;
            return next();
          });
        }
        return next();
      }

        var nurses = nurseRecs
          .map(function (r) {
            return {
              recordId: r.recordId,
              id: txt(r.fields['工号']),
              name: txt(r.fields['姓名']),
              gender: txt(r.fields['性别']),
              phone: txt(r.fields['电话']),
              note: txt(r.fields['备注']),
            };
          })
          .filter(function (n) {
            return n.name;
          });

        var rooms = [];
        roomRecs.forEach(function (r) {
          var f = r.fields;
          var fl = firstLink(f['楼层']);
          var nr = firstLink(f['护理人员 '] !== undefined ? f['护理人员 '] : f['护理人员']);
          var room = {
            recordId: r.recordId,
            floor: fl && floorMap[fl] ? floorMap[fl].id : '',
            no: txt(f['寝室编号']),
            name: txt(f['寝室名称']) || txt(f['寝室编号']),
            beds: num(f['床位数']),
            nurse: nr ? nurseMap[nr] || '' : '',
          };
          roomMap[r.recordId] = room;
          if (room.floor && room.no) rooms.push(room);
        });
        rooms.sort(function (a, b) {
          return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
        });

        var members = [];
        memberRecs.forEach(function (r) {
          var f = r.fields;
          var name = txt(f['姓名']);
          if (!name) return; // 跳过占位空行
          var room = roomMap[firstLink(f['寝室'])];
          members.push({
            recordId: r.recordId,
            floor: room ? room.floor : '',
            room: room ? room.no : '',
            bed: num(f['床位号']),
            name: name,
            gender: txt(f['性别']),
            age: txt(f['年龄']),
            status: txt(f['状态']) || '入住',
            note: txt(f['备注']),
          });
        });

        return { floors: floors, rooms: rooms, nurses: nurses, members: members };
      }

      /* ================= 登录 ================= */
      var AUTH_KEY = 'vika_admin_auth';
      var SESSION_KEY = 'vika_admin_session';

      function getSavedAuth() {
        // 跨页免登录：同时识别本页与 index.html(大屏) 的登录态格式
        var candidates = [
          { store: localStorage, key: AUTH_KEY },
          { store: sessionStorage, key: SESSION_KEY },
          { store: localStorage, key: 'vika_auth' },
          { store: sessionStorage, key: 'vika_auth' },
        ];
        for (var i = 0; i < candidates.length; i++) {
          try {
            var raw = candidates[i].store.getItem(candidates[i].key);
            if (!raw) continue;
            var o = JSON.parse(raw);
            var acc = o.acc || o.account;
            var expires = o.expires || o.expire;
            if (acc && o.hash && expires > Date.now()) return { acc: acc, hash: o.hash, expires: expires };
            candidates[i].store.removeItem(candidates[i].key); // 过期清理
          } catch (e) {}
        }
        return null;
      }
      function saveAuth(acc, hash, remember) {
        var exp = Date.now() + 7 * 24 * 3600 * 1000;
        var data = JSON.stringify({ acc: acc, hash: hash, expires: exp });
        var v2Data = JSON.stringify({ account: acc, hash: hash, expire: exp }); // 兼容 index.html(大屏)
        if (remember) {
          localStorage.setItem(AUTH_KEY, data);
          localStorage.setItem('vika_auth', v2Data);
          sessionStorage.removeItem(SESSION_KEY);
          sessionStorage.removeItem('vika_auth');
        } else {
          sessionStorage.setItem(SESSION_KEY, data);
          sessionStorage.setItem('vika_auth', v2Data);
          localStorage.removeItem(AUTH_KEY);
          localStorage.removeItem('vika_auth');
        }
      }
      function clearAuth() {
        localStorage.removeItem(AUTH_KEY);
        localStorage.removeItem('vika_auth');
        sessionStorage.removeItem(SESSION_KEY);
        sessionStorage.removeItem('vika_auth');
      }
      function validateAccount(acc, pwdHash) {
        var safe = String(acc).replace(/"/g, '\\"');
        // 账号 + 密码摘要同时作为服务端筛选条件，只返回 账号/备注（不回传密码与创建时间）
        var formula = 'AND({账号}="' + safe + '",{密码}="' + String(pwdHash).toLowerCase() + '")';
        var url =
          'https://api.vika.cn/fusion/v1/datasheets/' +
          TABLES.accounts.dst +
          '/records?viewId=' +
          TABLES.accounts.view +
          '&fieldKey=name&fields=' +
          encodeURIComponent('账号,备注') +
          '&filterByFormula=' +
          encodeURIComponent(formula) +
          '&pageSize=1';
        return vikaFetch(url).then(function (json) {
          if (json.code !== 200) throw new Error(json.message || 'Vika API error');
          return (json.data.records || []).length > 0;
        });
      }

      function computeStats(D) {
        var bedTotal = 0;
        D.rooms.forEach(function (r) {
          bedTotal += r.beds;
        });

        var statusCount = { 入住: 0, 请假: 0, 住院: 0, 空闲: 0 };
        D.members.forEach(function (m) {
          if (statusCount[m.status] === undefined) statusCount[m.status] = 0;
          statusCount[m.status]++;
        });

        var people = D.members.length;
        var emptyBeds = Math.max(bedTotal - people, 0);
        var rate = bedTotal ? Math.round((statusCount['入住'] / bedTotal) * 1000) / 10 : 0;

        var roomPeople = {};
        D.members.forEach(function (m) {
          var k = m.floor + '|' + m.room;
          roomPeople[k] = (roomPeople[k] || 0) + 1;
        });

        var floorStats = D.floors.map(function (f) {
          var rooms = D.rooms.filter(function (r) {
            return r.floor === f.id;
          });
          var beds = 0;
          rooms.forEach(function (r) {
            beds += r.beds;
          });
          var st = { 入住: 0, 请假: 0, 住院: 0, 空闲: 0 };
          D.members.forEach(function (m) {
            if (m.floor === f.id) {
              st[m.status] = (st[m.status] || 0) + 1;
            }
          });
          var occ = st['入住'] + st['请假'] + st['住院'];
          return {
            id: f.id,
            name: f.name,
            rooms: rooms.length,
            beds: beds,
            status: st,
            empty: Math.max(beds - occ - st['空闲'], 0),
            rate: beds ? Math.round((st['入住'] / beds) * 1000) / 10 : 0,
          };
        });

        var nurseStats = D.nurses
          .map(function (n) {
            var rooms = D.rooms.filter(function (r) {
              return r.nurse === n.name;
            });
            var people = 0;
            rooms.forEach(function (r) {
              people += roomPeople[r.floor + '|' + r.no] || 0;
            });
            return { name: n.name, gender: n.gender, rooms: rooms.length, people: people };
          })
          .filter(function (n) {
            return n.rooms > 0;
          })
          .sort(function (a, b) {
            return b.rooms - a.rooms || b.people - a.people;
          });

        return {
          bedTotal: bedTotal,
          roomCount: D.rooms.length,
          floorCount: D.floors.length,
          people: people,
          statusCount: statusCount,
          emptyBeds: emptyBeds,
          rate: rate,
          floorStats: floorStats,
          nurseStats: nurseStats,
          roomPeople: roomPeople,
        };
      }

              textStyle: { color: '#8a94a6', fontSize: 11 },
            },
            title: {
              text: String(total),
              subtext: '在册人员',
              left: 'center',
              top: '32%',
              textStyle: { fontSize: 22, fontWeight: 700, color: '#1f2d3d' },
              subtextStyle: { fontSize: 11, color: '#8a94a6' },
            },
            series: [
              {
                type: 'pie',
                radius: ['48%', '68%'],
                center: ['50%', '46%'],
                avoidLabelOverlap: false,
                label: { show: false },
                itemStyle: { borderColor: '#fff', borderWidth: 2 },
                data: [
                  { name: '入住', value: st['入住'] || 0 },
                  { name: '请假', value: st['请假'] || 0 },
                  { name: '住院', value: st['住院'] || 0 },
                  { name: '空闲', value: st['空闲'] || 0 },
                ],
              },
            ],
          });
        }

        /* 3. 各楼层入住率 */
        var c3 = initChart('chartRate');
        if (c3) {
          c3.setOption({
            tooltip: Object.assign({ trigger: 'axis', formatter: '{b}<br/>入住率：{c}%' }, tooltipCommon),
            grid: { left: 6, right: 12, top: 26, bottom: 8, containLabel: true },
            xAxis: Object.assign(
              {
                type: 'category',
                data: S.floorStats.map(function (f) {
                  return f.name;
                }),
              },
              axisCommon,
            ),
            yAxis: Object.assign(
              { type: 'value', max: 100, splitLine: { lineStyle: { color: '#f2f5fa' } } },
              axisCommon,
            ),
            series: [
              {
                type: 'bar',
                barMaxWidth: 28,
                data: S.floorStats.map(function (f) {
                  return f.rate;
                }),
                itemStyle: {
                  borderRadius: [5, 5, 0, 0],
                  color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#8fb6ff' },
                    { offset: 1, color: '#2f6ef7' },
                  ]),
                },
                label: { show: true, position: 'top', formatter: '{c}%', color: '#5b6b82', fontSize: 11 },
              },
            ],
          });
        }

        /* 4. 性别构成 */
        var c4 = initChart('chartGender');
        if (c4) {
          var male = 0,
            female = 0,
            unknown = 0;
          D.members.forEach(function (m) {
            if (m.gender === '男') male++;
            else if (m.gender === '女') female++;
            else unknown++;
          });
          c4.setOption({
            color: [C.lightBlue, '#ff9fb2', C.gray],
            tooltip: Object.assign({ trigger: 'item', formatter: '{b}：{c} 人（{d}%）' }, tooltipCommon),
            legend: {
              bottom: 0,
              icon: 'circle',
              itemWidth: 8,
              itemHeight: 8,
              itemGap: 14,
              textStyle: { color: '#8a94a6', fontSize: 11 },
            },
            series: [
              {
                type: 'pie',
                radius: ['46%', '66%'],
                center: ['50%', '44%'],
                label: { show: true, formatter: '{b}\n{d}%', fontSize: 11, color: '#5b6b82', lineHeight: 15 },
                labelLine: { length: 8, length2: 8, lineStyle: { color: '#dbe3ef' } },
                itemStyle: { borderColor: '#fff', borderWidth: 2 },
                data: [
                  { name: '女', value: female },
                  { name: '男', value: male },
                  { name: '未填', value: unknown },
                ].filter(function (x) {
                  return x.value > 0;
                }),
              },
            ],
          });
        }

        /* 5. 寝室床位规模 */
        var c5 = initChart('chartBeds');
        if (c5) {
          var dist = {};
          D.rooms.forEach(function (r) {
            var b = r.beds || 0;
            dist[b] = (dist[b] || 0) + 1;
          });
          var keys = Object.keys(dist)
            .map(Number)
            .sort(function (a, b) {
              return a - b;
            });
          c5.setOption({
            tooltip: Object.assign({ trigger: 'axis', formatter: '{b} 床寝室：{c} 间' }, tooltipCommon),
            grid: { left: 6, right: 12, top: 22, bottom: 8, containLabel: true },
            xAxis: Object.assign(
              {
                type: 'category',
                data: keys.map(function (k) {
                  return k + '床';
                }),
              },
              axisCommon,
            ),
            yAxis: Object.assign(
              { type: 'value', minInterval: 1, splitLine: { lineStyle: { color: '#f2f5fa' } } },
              axisCommon,
            ),
            series: [
              {
                type: 'bar',
                barMaxWidth: 30,
                data: keys.map(function (k) {
                  return dist[k];
                }),
                itemStyle: {
                  borderRadius: [5, 5, 0, 0],
                  color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#a9c8ff' },
                    { offset: 1, color: '#5b8cff' },
                  ]),
                },
                label: { show: true, position: 'top', color: '#5b6b82', fontSize: 11, formatter: '{c} 间' },
              },
            ],
          });
        }
      }

      function renderHome(force) {
        var now = new Date();
        $('greeting').textContent = greetingText(now.getHours());
        $('todayText').textContent = fmtDate(now);
        $('updateTime').textContent = '读取中…';

        loadAllData(force)
          .then(function (D) {
            var S = computeStats(D);
            renderMetrics(S, D);
            renderNurseRank(S);
    renderEmptyRooms(S, D);
    renderCharts(S, D);
            $('updateTime').textContent = '更新于 ' + now.toTimeString().slice(0, 8);
            $('welcomeDesc').textContent =
              '共 ' +
              S.floorCount +
              ' 个楼层 · ' +
              S.roomCount +
              ' 间寝室 · ' +
              S.bedTotal +
              ' 个床位，在住 ' +
              S.statusCount['入住'] +
              ' 人，入住率 ' +
              S.rate +
              '%';
          })
          .catch(function (e) {
            $('updateTime').textContent = '读取失败';
            $('welcomeDesc').textContent = '数据读取失败：' + e.message;
            toast('数据读取失败：' + e.message, 'error');
          });
      }

      $('refreshBtn').onclick = function () {
        this.disabled = true;
        var self = this;
        renderHome(true);
        setTimeout(function () {
          self.disabled = false;
        }, 800);
      };

      window.addEventListener('resize', function () {
        Object.keys(charts).forEach(function (k) {
          if (charts[k]) charts[k].resize();
        });
      });

      /* ================= 表格页 ================= */
      function ensureLinkCache(table, field) {
        if (linkCache[table]) return Promise.resolve(linkCache[table]);
        return fetchAllRecords(table).then(function (recs) {
          linkCache[table] = recs.map(function (r) {
            return { recordId: r.recordId, text: txt(r.fields[field]) || r.recordId };
          });
          return linkCache[table];
        });
      }

      function loadTableData() {
        var key = currentView;
        var schema = SCHEMAS[key];
        $('loadingTip').style.display = 'block';
        $('emptyTip').style.display = 'none';
        $('tableBody').innerHTML = '';
        $('tableHead').innerHTML = '';
        $('recordCount').textContent = '';
        $('searchInput').value = '';
        $('searchInput').placeholder = '输入关键字搜索';

        var pre = [];
        schema.forEach(function (f) {
          if (f.type === 'link') pre.push(ensureLinkCache(f.linkTable, f.linkField));
        });

        Promise.all(pre)
          .then(function () {
            return fetchAllRecords(key);
          })
          .then(function (recs) {
            // 账号管理不显示 admin 账号
            if (key === 'accounts') {
              recs = recs.filter(function (r) {
                return txt((r.fields || {})['账号']) !== 'admin';
              });
            }
            allRecords = recs;
            renderTable(recs);
            $('loadingTip').style.display = 'none';
            if (!recs.length) $('emptyTip').style.display = 'block';
            $('recordCount').textContent = '共 ' + recs.length + ' 条';
          })
          .catch(function (e) {
            $('loadingTip').style.display = 'none';
            toast('加载失败：' + e.message, 'error');
          });
      }

      function cellText(f, val) {
        if (f.type === 'readonly' && val) {
          // 维格表 DateTime 返回毫秒时间戳（兼容秒级）
          var n = Number(val);
          var d = isNaN(n) ? new Date(val) : new Date(String(val).length <= 10 ? n * 1000 : n);
          if (!isNaN(d.getTime())) {
            var p = function (x) {
              return ('0' + x).slice(-2);
            };
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
          }
          return String(val);
        }
        if (f.type === 'link') {
          if (!Array.isArray(val)) return '';
          return val
            .map(function (id) {
              var hit = (linkCache[f.linkTable] || []).filter(function (x) {
                return x.recordId === id;
              })[0];
              return hit ? hit.text : id;
            })
            .join(', ');
        }
        if (f.type === 'password' && val) return '••••••';
        return val === undefined || val === null ? '' : String(val);
      }

      function renderTable(recs) {
        var schema = SCHEMAS[currentView];
        var head = $('tableHead'),
          body = $('tableBody');
        head.innerHTML = '';
        body.innerHTML = '';

        var trh = document.createElement('tr');
        schema.forEach(function (f) {
          var th = document.createElement('th');
          th.textContent = f.label;
          trh.appendChild(th);
        });
        var thAct = document.createElement('th');
        thAct.textContent = '操作';
        trh.appendChild(thAct);
        head.appendChild(trh);

        recs.forEach(function (rec) {
          var tr = document.createElement('tr');
          var fields = rec.fields || {};
          schema.forEach(function (f) {
            var td = document.createElement('td');
            td.textContent = cellText(f, fields[f.key]);
            td.title = td.textContent;
            tr.appendChild(td);
          });
          var tdAct = document.createElement('td');
          tdAct.className = 'row-actions';
          var bEdit = document.createElement('button');
          bEdit.className = 'btn btn-primary btn-sm';
          bEdit.textContent = '编辑';
          bEdit.onclick = function () {
            openEdit(rec);
          };
          var bDel = document.createElement('button');
          bDel.className = 'btn btn-danger btn-sm';
          bDel.textContent = '删除';
          bDel.onclick = function () {
            openConfirm(rec.recordId);
          };
          tdAct.appendChild(bEdit);
          tdAct.appendChild(bDel);
          tr.appendChild(tdAct);
          body.appendChild(tr);
        });
      }

      $('searchInput').oninput = function () {
        var kw = this.value.trim().toLowerCase();
        if (!kw) {
          renderTable(allRecords);
          return;
        }
        var schema = SCHEMAS[currentView];
        renderTable(
          allRecords.filter(function (rec) {
            var fields = rec.fields || {};
            // 用 cellText 解析后的显示文本匹配：关联字段(如护理人员)按姓名搜索，而非原始 recordId
            return schema.some(function (f) {
              return cellText(f, fields[f.key]).toLowerCase().indexOf(kw) >= 0;
            });
          }),
        );
      };

      /* ================= 新增 / 编辑 ================= */
      $('addBtn').onclick = function () {
        openEdit(null);
      };
      $('modalCancel').onclick = function () {
        $('editModal').classList.add('hidden');
      };

      function openEdit(rec) {
        editingRecordId = rec ? rec.recordId : null;
        $('modalTitle').textContent = (rec ? '编辑' : '新增') + ' · ' + TABLES[currentView].label;
        var form = $('modalForm');
        form.innerHTML = '';
        var schema = SCHEMAS[currentView];
        var fields = rec ? rec.fields || {} : {};

        schema.forEach(function (f, i) {
          if (f.type === 'readonly') return;
          var group = document.createElement('div');
          group.className = 'form-group';
          var label = document.createElement('label');
          label.textContent = f.label;
          group.appendChild(label);

          var input;
          if (f.type === 'select') {
            input = document.createElement('select');
            f.options.forEach(function (opt) {
              var o = document.createElement('option');
              o.value = opt;
              o.textContent = opt;
              input.appendChild(o);
            });
            var cur = txt(fields[f.key]);
            if (cur && f.options.indexOf(cur) >= 0) input.value = cur;
          } else if (f.type === 'link') {
            input = document.createElement('select');
            (linkCache[f.linkTable] || []).forEach(function (o) {
              var op = document.createElement('option');
              op.value = o.recordId;
              op.textContent = o.text;
              input.appendChild(op);
            });
            var first = firstLink(fields[f.key]);
            if (first) input.value = first;
          } else if (f.type === 'password') {
            input = document.createElement('input');
            input.type = 'text';
            input.placeholder = rec ? '留空则不修改' : '请输入密码';
            input.value = '';
          } else {
            input = document.createElement('input');
            input.type = 'text';
            input.value = fields[f.key] === undefined ? '' : String(fields[f.key]);
          }
          input.id = 'form_' + i;
          group.appendChild(input);
          form.appendChild(group);
        });

        $('editModal').classList.remove('hidden');
      }

      $('modalSave').onclick = function () {
        var schema = SCHEMAS[currentView];
        var data = {};
        schema.forEach(function (f, i) {
          if (f.type === 'readonly') return;
          var el = $('form_' + i);
          if (!el) return;
          var val = el.value.trim();
          if (f.type === 'password') {
            if (val) data[f.key] = md5(val); // 编辑留空则不修改
          } else if (f.type === 'link') {
            if (val) data[f.key] = [val];
          } else {
            data[f.key] = val;
          }
        });

        var btn = $('modalSave');
        btn.disabled = true;
        btn.textContent = '保存中…';
        // 编辑时取原始记录用于日志
        var beforeRec = editingRecordId
          ? allRecords.filter(function (r) {
              return r.recordId === editingRecordId;
            })[0]
          : null;
        var p = editingRecordId ? updateRecord(currentView, editingRecordId, data) : createRecord(currentView, data);

        p.then(function (json) {
          btn.disabled = false;
          btn.textContent = '保存';
          if (json.code === 200 || json.success) {
            $('editModal').classList.add('hidden');
            toast(editingRecordId ? '更新成功' : '新增成功');
            logOperation(editingRecordId ? '编辑' : '新增', TABLES[currentView].label, beforeRec ? beforeRec.fields : null, data);
            linkCache = {};
            DATA = null;
            loadTableData();
          } else {
            toast('保存失败：' + (json.message || '未知错误'), 'error');
          }
        }).catch(function (e) {
          btn.disabled = false;
          btn.textContent = '保存';
          toast('保存失败：' + e.message, 'error');
        });
      };

      /* ================= 删除 ================= */
      function openConfirm(recordId) {
        deletingRecordId = recordId;
        $('confirmModal').classList.remove('hidden');
      }
      $('confirmCancel').onclick = function () {
        $('confirmModal').classList.add('hidden');
        deletingRecordId = null;
      };
      $('confirmOk').onclick = function () {
        if (!deletingRecordId) return;
        var btn = $('confirmOk');
        var id = deletingRecordId;
        // 取被删记录用于日志
        var delRec = allRecords.filter(function (r) {
          return r.recordId === id;
        })[0];
        btn.disabled = true;
        btn.textContent = '删除中…';
        deleteRecord(currentView, id)
          .then(function (json) {
            btn.disabled = false;
            btn.textContent = '删除';
            $('confirmModal').classList.add('hidden');
            deletingRecordId = null;
            if (json.code === 200 || json.success) {
              toast('删除成功');
              logOperation('删除', TABLES[currentView].label, delRec ? delRec.fields : null, null);
              linkCache = {};
              DATA = null;
              loadTableData();
            } else {
              toast('删除失败：' + (json.message || '未知错误'), 'error');
            }
          })
          .catch(function (e) {
            btn.disabled = false;
            btn.textContent = '删除';
            $('confirmModal').classList.add('hidden');
            toast('删除失败：' + e.message, 'error');
          });
      };

      $('editModal').onclick = function (e) {
        if (e.target === this) this.classList.add('hidden');
      };
      $('confirmModal').onclick = function (e) {
        if (e.target === this) this.classList.add('hidden');
      };
    </script>
  </body>
</html>
